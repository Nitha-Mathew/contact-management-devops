name: Flask CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Nithatemp@1234'
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for SQL Server
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          
          echo "Waiting for SQL Server to become ready..."
          
          for i in {1..30}; do
            if docker exec "$SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P 'Nithatemp@1234' \
              -C \
              -Q "SELECT 1" > /dev/null 2>&1
            then
              echo "SQL Server is ready!"
              break
            fi
          
            echo "SQL Server is not ready yet. Waiting..."
            sleep 2
          done

      - name: Initialize SQL Server
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          docker exec -i "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P 'Nithatemp@1234' \
            -C \
            -i /dev/stdin < ci/init.sql

      - name: Verify CI database login
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker exec "$SQL_CONTAINER" \
          /opt/mssql-tools18/bin/sqlcmd \
          -S localhost \
          -U sa \
          -P 'Nithatemp@1234' \
          -C \
          -Q "SELECT name FROM sys.sql_logins WHERE name = 'devops_app';"
          
      - name: Verify database user
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker exec "$SQL_CONTAINER" \
          /opt/mssql-tools18/bin/sqlcmd \
          -S localhost \
          -U sa \
          -P 'Nithatemp@1234' \
          -C \
          -d DevOpsAI \
          -Q "SELECT name FROM sys.database_principals WHERE name = 'devops_app';"

      - name: Verify devops_app login
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          docker exec -i "$SQL_CONTAINER" \
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U devops_app \
            -P 'NithaCIApp@1234' \
            -d DevOpsAI \
            -C \
            -Q "SELECT SYSTEM_USER, DB_NAME();"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build test Docker image
        run: docker build -t flask-test .

      - name: Test pyodbc connection
        run: |
          docker run --rm \
          --add-host=host.docker.internal:host-gateway \
          -e DB_SERVER=host.docker.internal,1433 \
          -e DB_NAME=DevOpsAI \
          -e DB_USER=devops_app \
          -e DB_PASSWORD='NithaCIApp@1234' \
          flask-test \
          python -c "import os, pyodbc; print('Connecting...'); conn=pyodbc.connect(f'DRIVER={{ODBC Driver 18 for SQL Server}};SERVER={os.getenv(\"DB_SERVER\")};DATABASE={os.getenv(\"DB_NAME\")};UID={os.getenv(\"DB_USER\")};PWD={os.getenv(\"DB_PASSWORD\")};TrustServerCertificate=yes;'); print('PYODBC CONNECTION SUCCESS')"

      - name: Run tests
        run: |
          docker run --rm \
          --add-host=host.docker.internal:host-gateway \
            -e DB_SERVER=host.docker.internal,1433 \
            -e DB_NAME=DevOpsAI \
            -e DB_USER=devops_app \
            -e DB_PASSWORD='NithaCIApp@1234' \
            flask-test \
            python -m pytest tests/test_app.py