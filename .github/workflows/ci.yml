name: Flask CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest



    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Wait for SQL Server
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          echo "Waiting for SQL Server to become ready..."

          for i in {1..30}; do
            if docker exec "$SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C \
              -Q "SELECT 1" > /dev/null 2>&1
            then
              echo "SQL Server is ready!"
              break
            fi

            echo "SQL Server is not ready yet. Waiting..."
            sleep 2
          done

      - name: Initialize SQL Server
        run: |
          sed "s|APP_PASSWORD_PLACEHOLDER|$DB_PASSWORD|g" ci/init.sql > /tmp/init.sql

          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker cp /tmp/init.sql "$SQL_CONTAINER:/tmp/init.sql"

          docker exec "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -i /tmp/init.sql

      - name: Verify CI database login
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker exec "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -Q "SELECT name FROM sys.sql_logins WHERE name = 'devops_app';"

      - name: Verify database user
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker exec "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -d DevOpsAI \
            -Q "SELECT name FROM sys.database_principals WHERE name = 'devops_app';"

      - name: Verify devops_app login
        run: |
          SQL_CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")

          docker exec -i "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U devops_app \
            -P "$DB_PASSWORD" \
            -d DevOpsAI \
            -C \
            -Q "SELECT SYSTEM_USER, DB_NAME();"

      - name: Build Docker image
        run: docker build --no-cache -t flask-test .

      - name: Verify Python dependencies in image
        run: |
          docker run --rm flask-test \
            python -c "import dotenv, pyodbc; print('Required Python dependencies are installed')"

      - name: Test pyodbc connection
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e DB_SERVER=host.docker.internal,1433 \
            -e DB_NAME=DevOpsAI \
            -e DB_USER=devops_app \
            -e DB_PASSWORD="$DB_PASSWORD" \
            flask-test \
            python -c "import os, pyodbc; print('Connecting...'); conn=pyodbc.connect(f'DRIVER={{ODBC Driver 18 for SQL Server}};SERVER={os.getenv(\"DB_SERVER\")};DATABASE={os.getenv(\"DB_NAME\")};UID={os.getenv(\"DB_USER\")};PWD={os.getenv(\"DB_PASSWORD\")};TrustServerCertificate=yes;'); print('PYODBC CONNECTION SUCCESS')"

      - name: Run tests
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e DB_SERVER=host.docker.internal,1433 \
            -e DB_NAME=DevOpsAI \
            -e DB_USER=devops_app \
            -e DB_PASSWORD="$DB_PASSWORD" \
            flask-test \
            python -m pytest tests/test_app.py

      - name: Smoke test application container
        run: |
          docker run -d \
            --name contact-management-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 5001:5001 \
            -e DB_SERVER=host.docker.internal,1433 \
            -e DB_NAME=DevOpsAI \
            -e DB_USER=devops_app \
            -e DB_PASSWORD="$DB_PASSWORD" \
            flask-test

          echo "Waiting for Flask application..."
          sleep 5

          curl --fail http://localhost:5001/api/users

          echo "Application smoke test passed!"

          docker stop contact-management-ci
          docker rm contact-management-ci

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          docker tag \
            flask-test \
            ghcr.io/nitha-mathew/contact-management-devops:${VERSION}

      - name: Push release image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          docker push \
            ghcr.io/nitha-mathew/contact-management-devops:${VERSION}
          
  runner-test:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Check Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes